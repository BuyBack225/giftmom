<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для любимой мамы</title>
    <style>
        /* Базовые настройки */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdf2f4; 
        }

        /* --- ЭКРАН 1: ЗАСТАВКА --- */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            background-color: #fdf2f4; 
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro-screen h1 {
            color: #d15b73; 
            font-size: 10vw; 
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.9);
            line-height: 1.2;
        }

        #intro-screen p {
            color: #6c4b53;
            font-size: 5vw;
            margin-bottom: 40px;
            text-shadow: 1px 1px 5px rgba(255,255,255,0.9);
        }

        .btn {
            padding: 15px 40px;
            font-size: 5vw;
            color: #fff;
            background-color: #d15b73; 
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(209, 91, 115, 0.4);
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            animation: pulse 2s infinite; 
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #b54960;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(209, 91, 115, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(209, 91, 115, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(209, 91, 115, 0); }
        }

        /* --- ЭКРАН 2: ВИДЕО --- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #000;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* --- ЭКРАН 3: ФИНАЛЬНАЯ НАДПИСЬ --- */
        #outro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0; 
            visibility: hidden;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        #outro-screen.show {
            opacity: 1;
            visibility: visible;
        }

        #outro-screen h2 {
            color: #ffffff;
            font-size: 12vw;
            text-align: center;
            text-shadow: 0 4px 20px rgba(209, 91, 115, 0.8);
            transform: scale(0.8);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.3;
        }

        #outro-screen.show h2 {
            transform: scale(1);
        }

        @media (min-width: 768px) {
            #intro-screen h1 { font-size: 64px; }
            #intro-screen p { font-size: 24px; }
            .btn { font-size: 22px; }
            #outro-screen h2 { font-size: 80px; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Заставка -->
    <div id="intro-screen">
        <h1>Для любимой<br>мамы</h1>
        <p>С любовью и благодарностью от любимого сына</p>
        <button class="btn" onclick="startVideo()">Посмотреть видео</button>
    </div>

    <!-- ЭКРАН 2: Видео -->
    <div class="video-background">
        <!-- ВАЖНО: Убедитесь, что название файла совпадает (video.mp4) -->
        <video id="myVideo" muted playsinline preload="auto">
            <source src="video.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <!-- ЭКРАН 3: Финальная надпись -->
    <div id="outro-screen">
        <h2>Спасибо<br>за просмотр!</h2>
    </div>

    <script>
        // Ждем, пока загрузится вся страница (DOM)
        document.addEventListener('DOMContentLoaded', function() {
            
            const video = document.getElementById('myVideo');
            const introScreen = document.getElementById('intro-screen');
            const outroScreen = document.getElementById('outro-screen');

            // 1. Функция запуска (привязываем её к глобальному объекту window, чтобы кнопка её видела)
            window.startVideo = function() {
                introScreen.classList.add('hidden');
                video.play().catch(function(error) {
                    console.log("Ошибка воспроизведения:", error);
                });
            };

            // 2. Слушатель окончания видео
            video.addEventListener('ended', function() {
                // Когда видео закончилось, ждем 3 секунды (3000 мс)
                setTimeout(function() {
                    outroScreen.classList.add('show');
                }, 1000); // <--- Здесь можно изменить задержку
            });

        });
    </script>

</body>
</html>
